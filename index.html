<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <title>אזרחות בכיף – הכנה לבגרות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Frank+Ruhl+Libre:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --ink: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --brand: #2563eb;
  --brand-dark: #1e3a8a;
  --brand-soft: #eff4ff;
  --ok: #059669; --ok-soft: #ecfdf5; --ok-line: #a7f3d0;
  --bad: #dc2626; --bad-soft: #fef2f2; --bad-line: #fecaca;
  --warn: #b45309; --warn-soft: #fffbeb; --warn-line: #fde68a;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.05);
  --amber: #d97706; --blue: #2563eb; --teal: #0d9488; --purple: #7c3aed;
  --coral: #ea580c; --red: #dc2626; --green: #16a34a; --pink: #db2777; --gray: #64748b;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  font-family: 'Heebo', system-ui, sans-serif; background: var(--bg); color: var(--ink);
  font-size: 16px; line-height: 1.6; min-height: 100vh;
}
button { font-family: inherit; font-size: inherit; cursor: pointer; }
textarea { font-family: inherit; font-size: 15px; }

/* ---------- shell ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar-in { max-width: 720px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, #1d4ed8, #6366f1); font-size: 18px; flex-shrink: 0; }
.brand-name { font-weight: 900; font-size: 18px; line-height: 1.1; }
.brand-sub { font-size: 12px; color: var(--muted); }
.top-stats { margin-inline-start: auto; display: flex; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; padding: 4px 10px;
  border-radius: 999px; border: 1px solid var(--line); background: #fff; }
.pill.fire { color: #c2410c; background: #fff7ed; border-color: #fed7aa; }
.pill.xp { color: var(--brand); background: var(--brand-soft); border-color: #c7d7fe; }
.back { border: none; background: none; width: 38px; height: 38px; border-radius: 12px; font-size: 18px; color: var(--ink); }
.back:hover { background: var(--bg); }

main { max-width: 720px; margin: 0 auto; padding: 16px 16px 110px; }

.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottomnav-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav-btn { border: none; background: none; padding: 9px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--muted); font-size: 12px; font-weight: 600; }
.nav-btn i { font-size: 19px; }
.nav-btn.active { color: var(--brand); }

/* ---------- generic ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.stack > * + * { margin-top: 12px; }
.section-title { font-size: 18px; font-weight: 800; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
h1, h2, h3 { margin: 0; line-height: 1.3; }
.btn { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 11px 16px; border-radius: 12px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s, background .15s; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: #1d4ed8; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--brand); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; align-items: center; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bar { height: 8px; border-radius: 99px; background: #e8edf5; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--brand); transition: width .4s; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 8px; display: inline-block; }

/* color helpers */
.c-amber { --c: var(--amber); } .c-blue { --c: var(--blue); } .c-teal { --c: var(--teal); } .c-purple { --c: var(--purple); }
.c-coral { --c: var(--coral); } .c-red { --c: var(--red); } .c-green { --c: var(--green); } .c-pink { --c: var(--pink); } .c-gray { --c: var(--gray); }
.tint { background: color-mix(in srgb, var(--c) 11%, #fff); color: color-mix(in srgb, var(--c) 85%, #000); }
.icon-box { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }

/* ---------- home ---------- */
.hero { border-radius: 22px; padding: 20px; color: #fff; position: relative; overflow: hidden;
  background: linear-gradient(130deg, #1e3a8a 0%, #312e81 55%, #0f172a 100%); }
.hero::after { content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%; left: -60px; bottom: -90px;
  background: rgba(99,102,241,.35); filter: blur(30px); }
.hero > * { position: relative; z-index: 1; }
.hero h1 { font-size: 24px; font-weight: 900; }
.hero .bar { background: rgba(255,255,255,.18); margin: 10px 0 4px; }
.hero .bar > span { background: linear-gradient(90deg, #60a5fa, #a5b4fc); }
.hero .btn.primary { background: #fff; color: var(--brand-dark); border-color: #fff; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.quick button { border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 4px; display: flex; flex-direction: column;
  align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ink); box-shadow: var(--shadow); }
.quick button i { font-size: 20px; }
.quick .badge { font-size: 11px; background: var(--bad); color: #fff; border-radius: 99px; padding: 0 6px; }

.unit { display: flex; gap: 12px; align-items: center; cursor: pointer; transition: transform .1s; }
.unit:active { transform: scale(.99); }
.unit .meta { flex: 1; min-width: 0; }
.unit .name { font-weight: 800; }
.unit .sub { font-size: 13px; color: var(--muted); }
.unit .pct { font-weight: 800; font-size: 14px; color: var(--muted); }
.unit.done .pct { color: var(--ok); }
.path { position: relative; }
.path .unit + .unit { margin-top: 10px; }

/* ---------- unit page ---------- */
.unit-head { display: flex; gap: 12px; align-items: center; }
.tabs { display: flex; gap: 6px; background: #e9eef6; padding: 4px; border-radius: 14px; margin: 14px 0; }
.tabs button { flex: 1; border: none; background: transparent; padding: 9px 4px; border-radius: 10px; font-weight: 700; color: var(--muted); font-size: 14px; }
.tabs button.active { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.mnemonic { border-radius: var(--radius); padding: 14px 16px; border: 1px dashed color-mix(in srgb, var(--c) 45%, #fff); }
.mnemonic .word { font-size: 22px; font-weight: 900; letter-spacing: .5px; }
.concept { border: 1px solid var(--line); border-radius: 14px; background: #fff; overflow: hidden; }
.concept summary { list-style: none; padding: 13px 14px; font-weight: 800; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.concept summary::-webkit-details-marker { display: none; }
.concept summary .chev { margin-inline-start: auto; color: var(--muted); transition: transform .2s; }
.concept[open] summary .chev { transform: rotate(180deg); }
.concept .body { padding: 0 14px 14px; }
.concept ul, .plain-list { margin: 0; padding-inline-start: 20px; }
.concept li, .plain-list li { margin: 4px 0; }
.tip { margin-top: 10px; font-size: 14px; padding: 8px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); }
.askform { font-size: 14px; padding: 10px 12px; border-radius: 12px; background: var(--brand-soft); color: var(--brand-dark); border: 1px solid #c7d7fe; }

/* ---------- quiz ---------- */
.q-top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); font-weight: 600; }
.q-text { font-size: 18px; font-weight: 700; margin: 6px 0 12px; }
.opt { width: 100%; text-align: right; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 13px 14px; margin: 8px 0;
  display: flex; gap: 10px; align-items: center; font-weight: 600; color: var(--ink); transition: border-color .15s, background .15s; }
.opt .letter { width: 28px; height: 28px; border-radius: 9px; background: #eef2f7; display: grid; place-items: center; font-weight: 800; font-size: 14px; flex-shrink: 0; }
.opt:hover:not(:disabled) { border-color: #93b4fb; }
.opt.sel { border-color: var(--brand); background: var(--brand-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); color: #065f46; }
.opt.right .letter { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: #991b1b; }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.feedback { border-radius: 14px; padding: 12px 14px; margin-top: 10px; font-size: 15px; }
.feedback.ok { background: var(--ok-soft); border: 1px solid var(--ok-line); color: #065f46; }
.feedback.bad { background: var(--bad-soft); border: 1px solid var(--bad-line); color: #991b1b; }
.sticky-actions { position: sticky; bottom: 76px; margin-top: 14px; display: flex; gap: 10px; }
.sticky-actions .btn { flex: 1; box-shadow: var(--shadow); }

/* ---------- event ---------- */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 14px; }
.step { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.step .dot { width: 34px; height: 34px; margin: 0 auto 3px; border-radius: 11px; display: grid; place-items: center; font-weight: 900; font-size: 16px;
  background: #e9eef6; color: var(--muted); }
.step.cur .dot { background: var(--brand); color: #fff; }
.step.cur { color: var(--brand); }
.step.done .dot { background: var(--ok); color: #fff; }
.passage { background: #fbfcfe; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 16px; line-height: 1.8; }
.passage .s { border-radius: 6px; padding: 1px 2px; transition: background .15s; }
.passage.pick .s { cursor: pointer; background: #f1f5fb; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.passage.pick .s:hover { background: #fef3c7; }
.passage .s.sel { background: #fde68a !important; }
.passage .s.right { background: #bbf7d0 !important; }
.passage .s.wrong { background: #fecaca !important; }
.ask { font-weight: 800; margin: 12px 0 8px; display: flex; gap: 8px; }
.choice-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { border: 1.5px solid var(--line); background: #fff; padding: 9px 13px; border-radius: 12px; font-weight: 700; color: var(--ink); font-size: 15px; }
.choice:hover:not(:disabled) { border-color: #93b4fb; }
.choice.right { border-color: var(--ok); background: var(--ok-soft); color: #065f46; }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); color: #991b1b; text-decoration: line-through; }
textarea.answer { width: 100%; min-height: 110px; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; resize: vertical; background: #fff; }
textarea.answer:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px #dbe6fe; }
.checklist label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); margin: 6px 0; background: #fff; }
.checklist input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--ok); }
.model { background: var(--ok-soft); border: 1px solid var(--ok-line); border-radius: 14px; padding: 12px 14px; color: #064e3b; }
.full-answer .line { padding: 10px 0; border-bottom: 1px solid var(--line); }
.full-answer .line:last-child { border-bottom: none; }
.full-answer b { color: var(--brand); }
.err { color: var(--bad); font-size: 14px; margin-top: 6px; }

/* ---------- megilla ---------- */
.scroll-intro { background: linear-gradient(160deg, #fffbeb, #fef3c7); border: 1px solid #fde68a; border-radius: 20px; padding: 18px; }
.scroll-intro h1 { font-size: 22px; font-weight: 900; color: #78350f; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { white-space: nowrap; border: 1px solid var(--line); background: #fff; padding: 6px 12px; border-radius: 99px; font-weight: 700; font-size: 13px; color: var(--muted); }
.filters button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.para { background: #fffdf7; border: 1px solid #f1e4c3; border-radius: 16px; padding: 14px 16px; }
.para .num { font-size: 12px; font-weight: 800; color: #a16207; }
.para .ptext { font-family: 'Frank Ruhl Libre', 'David', serif; font-size: 18px; line-height: 1.85; margin: 6px 0 8px; color: #1c1917; }
.para .exp { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 15px; white-space: pre-line; margin-top: 8px; }
.parts-map { display: grid; grid-template-columns: 1fr; gap: 8px; }
.part-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; }

/* ---------- flashcards ---------- */
.flash { perspective: 1000px; height: 260px; cursor: pointer; }
.flash-in { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
.flash.flip .flash-in { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px; padding: 20px; display: flex; flex-direction: column;
  justify-content: center; align-items: center; text-align: center; border: 1px solid var(--line); background: #fff; box-shadow: var(--shadow); }
.flash-back { transform: rotateY(180deg); align-items: stretch; text-align: right; overflow-y: auto; justify-content: flex-start; }
.flash-face .big { font-size: 26px; font-weight: 900; }

/* ---------- results ---------- */
.score-ring { width: 130px; height: 130px; border-radius: 50%; margin: 6px auto 10px; display: grid; place-items: center;
  background: conic-gradient(var(--brand) calc(var(--p) * 1%), #e8edf5 0); }
.score-ring > div { width: 104px; height: 104px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 900; }
.review-item { border-inline-start: 4px solid var(--line); padding: 4px 12px; margin: 10px 0; }
.review-item.ok { border-color: var(--ok); }
.review-item.bad { border-color: var(--bad); }

.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px;
  font-weight: 700; font-size: 14px; z-index: 50; animation: pop .25s; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } }
.fade { animation: fade .25s; }
@keyframes fade { from { transform: translateY(6px); } }

@media (min-width: 720px) {
  main { padding-top: 22px; }
  .hero { padding: 28px; }
  .hero h1 { font-size: 30px; }
}

/* ---------- desktop / computer ---------- */
@media (min-width: 960px) {
  .topbar-in, .bottomnav-in, main { max-width: 1080px; }
  .topbar { border-bottom: none; }
  .bottomnav { top: 58px; bottom: auto; border-top: none; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.95); backdrop-filter: blur(8px); }
  .bottomnav-in { display: flex; gap: 4px; padding: 0 16px; }
  .nav-btn { flex-direction: row; gap: 8px; font-size: 15px; padding: 12px 16px; border-bottom: 3px solid transparent; }
  .nav-btn i { font-size: 16px; }
  .nav-btn.active { border-bottom-color: var(--brand); }
  main { padding: 84px 24px 60px; }
  .hero { padding: 36px 40px; }
  .hero h1 { font-size: 36px; }
  .hero .btn.primary.block { width: auto; padding: 12px 22px; }
  .quick { grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .quick button { padding: 18px 8px; font-size: 15px; flex-direction: row; justify-content: center; gap: 10px; }
  .path, .stack.cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .path .unit + .unit { margin-top: 0; }
  .stack.cards2 > * + * { margin-top: 0; }
  .unit:hover { border-color: #c7d7fe; transform: translateY(-1px); }
  .sticky-actions { bottom: 16px; max-width: 420px; margin-inline-start: auto; }
  .toast { bottom: 24px; }
  .narrow { max-width: 760px; margin-inline: auto; }
  .grid2 { gap: 14px; }
  .para .ptext { font-size: 19px; }
  .flash { height: 300px; }
}

</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <button class="back" id="btn-back" aria-label="חזרה" hidden><i class="fa-solid fa-arrow-right"></i></button>
      <div class="logo" id="logo"><i class="fa-solid fa-scale-balanced"></i></div>
      <div>
        <div class="brand-name">אזרחות בכיף</div>
        <div class="brand-sub" id="page-sub">הכנה לבגרות באזרחות</div>
      </div>
      <div class="top-stats">
        <span class="pill fire" title="ימי תרגול ברצף"><i class="fa-solid fa-fire"></i><span id="streak">0</span></span>
        <span class="pill xp" title="נקודות"><i class="fa-solid fa-star"></i><span id="xp">0</span></span>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <nav class="bottomnav">
    <div class="bottomnav-in">
      <button class="nav-btn" data-nav="home"><i class="fa-solid fa-house"></i>בית</button>
      <button class="nav-btn" data-nav="megilla"><i class="fa-solid fa-scroll"></i>המגילה</button>
      <button class="nav-btn" data-nav="practice"><i class="fa-solid fa-pen-to-square"></i>תרגול</button>
      <button class="nav-btn" data-nav="exam"><i class="fa-solid fa-stopwatch"></i>מבחן</button>
      <button class="nav-btn" data-nav="guide"><i class="fa-solid fa-graduation-cap"></i>צהצ"ה</button>
    </div>
  </nav>

  <script>
// =====================================================================
// תוכן האפליקציה: יחידות לימוד, מושגים, שאלות אמריקאיות ושאלות אירוע
// מבוסס על חוברת המיקוד של איתמר טרובק (תשפ"ז), כלי העזר ושאלות בגרות.
//
// איך מוסיפים שאלה?
//  • אמריקאית: מוסיפים אובייקט למערך mcq של היחידה:
//      { q: 'שאלה', o: ['א','ב','ג','ד'], a: אינדקס-התשובה-הנכונה (מ-0), why: 'הסבר' }
//  • אירוע: מוסיפים אובייקט למערך events של היחידה:
//      { text: ['משפט 1', 'משפט 2', ...], ask: 'ציינו והציגו את ...',
//        answer: 'מזהה-המושג', quote: [אינדקסים של המשפטים הנכונים], expl: 'הסבר לדוגמה' }
// =====================================================================

window.UNITS = [
  // ------------------------------------------------------------------
  {
    id: 'decl', name: 'הכרזת העצמאות', icon: 'fa-scroll', color: 'amber',
    intro: 'ההצדקות להקמת המדינה, המאפיינים היהודיים והדמוקרטיים שבהכרזה, וארבע הפניות לגורמים שונים. את הנוסח המלא עם הסבר על כל פסקה תמצאו בלשונית "המגילה".',
    askForm: 'ציינו והציגו את הפנייה מבין הפניות לגורמים שונים בהכרזת העצמאות שבאה לידי ביטוי בקטע.',
    mnemonic: { word: 'או"ם · ערבים · שכנות · תפוצות', note: 'ארבע הפניות במגילה – לפי סדר הופעתן' },

  <script>
(function () {

  function today() { return new Date().toISOString().slice(0, 10); }

    const t = today(); if (S.streak.last === t) return;
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    S.streak.count = S.streak.last === y ? S.streak.count + 1 : 1; S.streak.last = t;
  }
  function addXp(n) { S.xp += n; touch(); save(); }
  function addMistake(k) { if (!S.mistakes.includes(k)) S.mistakes.push(k); save(); }
  function clearMistake(k) { S.mistakes = S.mistakes.filter(x => x !== k); save(); }

  // ================= helpers =================
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function unitPct(u) {

    const ev = u.events.length ? Object.keys(p.ev).length / u.events.length : null;
    const pct = ev === null ? (p.learned ? 20 : 0) + 80 * mc : (p.learned ? 20 : 0) + 40 * mc + 40 * ev;
    return Math.round(pct);
  }
  function totalPct() { return Math.round(UNITS.reduce((s, u) => s + unitPct(u), 0) / UNITS.length); }
  function updateTop() {
    document.getElementById('xp').textContent = S.xp;

  }
  function setChrome(route, sub, back) {

    document.getElementById('logo').hidden = !!back;
  }
  function go(hash) { if (location.hash === '#' + hash) render(); else location.hash = hash; }

        <button data-go="/cards"><i class="fa-solid fa-clone" style="color:#7c3aed"></i>כרטיסיות</button>

  }
  function bindGo(root = view) { root.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => go(el.dataset.go))); }

  // ================= UNIT =================

    if (tab === 'learn') {
      el.innerHTML = `<div class="stack">
        <p style="margin:0">${esc(u.intro)}</p>
        ${u.id === 'decl' ? `<button class="btn block c-amber tint" style="border:none" data-go="/megilla"><i class="fa-solid fa-scroll"></i> לנוסח המלא של המגילה עם הסבר על כל פסקה</button>` : ''}
        ${u.mnemonic ? `<div class="mnemonic tint c-${u.color}"><div class="small" style="font-weight:700">ראשי תיבות לזכירה</div><div class="word">${esc(u.mnemonic.word)}</div><div class="small">${esc(u.mnemonic.note)}</div></div>` : ''}
        <div class="askform"><b>ככה זה נשאל בבגרות:</b> "${esc(u.askForm)}" – יש ${u.concepts.length} תשובות אפשריות.</div>
        <div class="section-title" style="margin-bottom:0">המושגים</div>
        ${u.concepts.map((c, i) => `${c.group && (i === 0 || u.concepts[i - 1].group !== c.group) ? `<div class="small" style="font-weight:800;color:var(--muted);margin-top:14px">${esc(GROUP_NAMES[c.group] || '')}</div>` : ''}<details class="concept"${i === 0 ? ' open' : ''}><summary><span class="tag tint c-${u.color}">${i + 1}</span>${esc(c.name)}<i class="fa-solid fa-chevron-down chev"></i></summary>
          <div class="body"><ul>${c.def.map(d => `<li>${esc(d)}</li>`).join('')}</ul>${c.tip ? `<div class="tip"><i class="fa-solid fa-lightbulb"></i> ${esc(c.tip)}</div>` : ''}</div></details>`).join('')}
        ${(u.extra || []).map(x => `<div class="card"><h3 style="font-weight:800;margin-bottom:6px">${esc(x.title)}</h3><ul class="plain-list">${x.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}
        <div class="grid2" style="margin-top:16px">
          <button class="btn" data-act="cards"><i class="fa-solid fa-clone"></i> כרטיסיות</button>
          <button class="btn primary" data-act="learned"><i class="fa-solid fa-check"></i> ${p.learned ? 'למדתי ✓ – לתרגול' : 'למדתי, לתרגול'}</button>
        </div></div>`;
      bindGo(el);
      el.querySelector('[data-act="cards"]').onclick = () => go('/cards/' + u.id);
      el.querySelector('[data-act="learned"]').onclick = () => { if (!p.learned) { p.learned = true; addXp(5); } go('/unit/' + u.id + '/mcq'); };
    } else if (tab === 'mcq') {
      const done = Object.keys(p.mcq).length;
      el.innerHTML = `<div class="card stack" style="text-align:center">
        <div class="icon-box tint c-${u.color}" style="margin:0 auto"><i class="fa-solid fa-list-check"></i></div>
        <h2 style="font-weight:800">${u.mcq.length} שאלות אמריקאיות</h2>
        <div class="muted small">ענית נכון על ${done} מתוך ${u.mcq.length}. אחרי כל שאלה תקבל הסבר מיד.</div>
        <div class="bar"><span style="width:${u.mcq.length ? done / u.mcq.length * 100 : 0}%"></span></div>
        <button class="btn primary block" data-act="go"><i class="fa-solid fa-play"></i> התחל תרגול</button></div>`;
      el.querySelector('[data-act="go"]').onclick = () => startMcq(shuffle(u.mcq.map((_, i) => ({ u: u.id, i }))), u.name, '/unit/' + u.id + '/mcq');
    } else {
      if (!u.events.length) { el.innerHTML = `<div class="card muted">ביחידה הזו אין שאלות אירוע – תרגלו אותה בשאלות אמריקאיות.</div>`; return; }
      el.innerHTML = `<div class="askform" style="margin-bottom:10px">כל שאלה מתורגלת שלב אחרי שלב: <b>ציין → הצג → ציטוט → הסבר</b>.</div>
        <div class="stack">${u.events.map((e, i) => {
          const sc = p.ev[i];
          return `<div class="card unit" data-ev="${i}"><div class="icon-box ${sc !== undefined ? 'tint c-green' : 'tint c-gray'}"><i class="fa-solid ${sc !== undefined ? 'fa-check' : 'fa-file-pen'}"></i></div>
            <div class="meta"><div class="name" style="font-size:15px">שאלה ${i + 1}${e.own ? ' <span class="tag tint c-gray">לתרגול</span>' : ''}</div><div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.text[0])}</div></div>
            ${sc !== undefined ? `<div class="pct" style="color:var(--ok)">${sc}%</div>` : '<i class="fa-solid fa-chevron-left muted"></i>'}</div>`;
        }).join('')}</div>`;
      el.querySelectorAll('[data-ev]').forEach(c => c.onclick = () => startEvents([{ u: u.id, i: +c.dataset.ev }], u.name, '/unit/' + u.id + '/events'));
    }
  }

  // ================= PRACTICE HUB =================
  function renderPractice() {
    setChrome('practice', 'תרגול');
    view.innerHTML = `
      <h1 style="font-size:24px;font-weight:900">תרגול</h1>
      <p class="muted" style="margin-top:4px">בחרו איך לתרגל. כל טעות נשמרת ב"הטעויות שלי" וחוזרת אליכם עד שתצליחו.</p>
      <div class="stack cards2">
        <div class="card unit" data-act="quick"><div class="icon-box tint c-blue"><i class="fa-solid fa-bolt"></i></div><div class="meta"><div class="name">תרגול מהיר</div><div class="sub">10 שאלות אמריקאיות מכל החומר</div></div></div>
        <div class="card unit" data-act="events"><div class="icon-box tint c-purple"><i class="fa-solid fa-file-pen"></i></div><div class="meta"><div class="name">שאלות אירוע (פתוחות)</div><div class="sub">3 שאלות צהצ"ה מכל החומר</div></div></div>
        <div class="card unit" data-act="mistakes"><div class="icon-box tint c-red"><i class="fa-solid fa-rotate-left"></i></div><div class="meta"><div class="name">הטעויות שלי</div><div class="sub">${S.mistakes.length ? S.mistakes.length + ' שאלות מחכות לך' : 'אין טעויות כרגע – כל הכבוד!'}</div></div></div>
        <div class="card unit" data-go="/cards"><div class="icon-box tint c-amber"><i class="fa-solid fa-clone"></i></div><div class="meta"><div class="name">כרטיסיות שינון</div><div class="sub">כל המושגים וההגדרות – הפוך וזכור</div></div></div>
      </div>
      <div class="section-title">לפי נושא</div>
      <div class="stack cards2">${UNITS.map(u => `<div class="card unit c-${u.color}" data-go="/unit/${u.id}/mcq"><div class="icon-box tint"><i class="fa-solid ${u.icon}"></i></div><div class="meta"><div class="name">${esc(u.name)}</div><div class="sub">${u.mcq.length} אמריקאיות · ${u.events.length} אירוע</div></div><div class="pct">${unitPct(u)}%</div></div>`).join('')}</div>`;
    bindGo();
    view.querySelector('[data-act="quick"]').onclick = () => startMcq(pickMcq(UNITS, 10), 'תרגול מהיר', '/practice');
    view.querySelector('[data-act="events"]').onclick = () => startEvents(pickEvents(3), 'שאלות אירוע', '/practice');
    view.querySelector('[data-act="mistakes"]').onclick = startMistakes;
  }
  function pickMcq(units, n) { return shuffle(units.flatMap(u => u.mcq.map((_, i) => ({ u: u.id, i })))).slice(0, n); }
  function pickEvents(n) { return shuffle(UNITS.flatMap(u => u.events.map((_, i) => ({ u: u.id, i })))).slice(0, n); }
  function startMistakes() {
    if (!S.mistakes.length) { toast('אין טעויות לתרגל 🎉'); return; }
    const items = S.mistakes.map(k => { const [t, u, i] = k.split(':'); return { type: t === 'm' ? 'mcq' : 'event', u, i: +i }; })
      .filter(x => unit(x.u) && (x.type === 'mcq' ? unit(x.u).mcq[x.i] : unit(x.u).events[x.i]));
    startSession(shuffle(items), 'הטעויות שלי', '/practice', 'practice');
  }

  // ================= SESSIONS =================
  function startMcq(items, title, back) { startSession(items.map(x => ({ type: 'mcq', ...x })), title, back, 'practice'); }
  function startEvents(items, title, back) { startSession(items.map(x => ({ type: 'event', ...x })), title, back, 'practice'); }
  function startSession(items, title, back, mode, minutes) {
    if (!items.length) { toast('אין שאלות להצגה'); return; }
    session = { items, title, back, mode, i: 0, results: [], start: Date.now(), finished: false,
      end: minutes ? Date.now() + minutes * 60000 : null,
      order: items.map(x => x.type === 'mcq' ? shuffle(unit(x.u).mcq[x.i].o.map((_, k) => k)) : null) };
    go('/session');
  }
  function renderSession() {
    const s = session;
    setChrome(s.mode === 'exam' ? 'exam' : 'practice', s.title, null);
    if (s.finished || s.i >= s.items.length) return renderResults();
    const it = s.items[s.i];
    view.innerHTML = `
      <div class="q-top"><span>${s.i + 1} / ${s.items.length}</span>
        ${s.end ? `<span class="chip tint c-amber"><i class="fa-solid fa-stopwatch"></i> <span id="clock"></span></span>` : ''}
        <button class="btn ghost" style="padding:4px 8px" id="quit"><i class="fa-solid fa-xmark"></i> יציאה</button></div>
      <div class="bar" style="margin:8px 0 14px;height:6px"><span style="width:${s.i / s.items.length * 100}%"></span></div>
      <div id="q"></div>`;
    document.getElementById('quit').onclick = () => { if (confirm(s.mode === 'exam' ? 'לסיים את המבחן עכשיו?' : 'לצאת מהתרגול?')) { if (s.mode === 'exam') { s.finished = true; renderResults(); } else { const b = s.back; session = null; go(b); } } };
    if (s.end) {
      const tick = () => { const left = Math.max(0, s.end - Date.now()); const c = document.getElementById('clock'); if (c) c.textContent = `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')}`; if (!left) { clearInterval(timer); s.finished = true; toast('הזמן נגמר!'); renderResults(); } };
      tick(); timer = setInterval(tick, 1000);
    }
    const q = document.getElementById('q');
    const next = res => { s.results[s.i] = res; s.i++; if (s.i >= s.items.length) s.finished = true; renderSession(); };
    if (it.type === 'mcq') runMcq(q, it, s.order[s.i], s.mode === 'exam', next);
    else runEvent(q, it, s.mode === 'exam', next);
  }

  // ---------- multiple choice ----------
  function runMcq(el, it, order, exam, done) {
    const u = unit(it.u), q = u.mcq[it.i], key = `m:${u.id}:${it.i}`;
    el.innerHTML = `<span class="tag tint c-${u.color}">${esc(u.name)}</span>
      <div class="q-text">${esc(q.q)}</div>
      <div id="opts">${order.map((k, n) => `<button class="opt" data-k="${k}"><span class="letter">${LETTERS[n]}</span><span>${esc(q.o[k])}</span></button>`).join('')}</div>
      <div id="fb"></div>
      <div class="sticky-actions"><button class="btn primary" id="act" disabled>בדיקה</button></div>`;
    let sel = null, checked = false;
    const act = el.querySelector('#act');
    el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (checked) return; sel = +b.dataset.k;
      el.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b)); act.disabled = false;
      if (exam) act.textContent = 'לשאלה הבאה';
    });
    act.onclick = () => {
      if (sel === null) return;
      const ok = sel === q.a;
      if (exam) { if (ok) clearMistake(key); else addMistake(key); return done({ type: 'mcq', ok, sel, u: u.id, i: it.i, score: ok ? 100 : 0 }); }
      if (!checked) {
        checked = true;
        el.querySelectorAll('.opt').forEach(x => { const k = +x.dataset.k; x.disabled = true; x.classList.remove('sel'); if (k === q.a) x.classList.add('right'); else if (k === sel) x.classList.add('wrong'); });
        el.querySelector('#fb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'bad'}"><b>${ok ? 'נכון! ' : 'לא נכון. '}</b>${esc(q.why)}</div>`;
        if (ok) { prog(u.id).mcq[it.i] = 1; clearMistake(key); addXp(10); } else addMistake(key);
        act.textContent = 'המשך'; act.focus();
      } else done({ type: 'mcq', ok, sel, u: u.id, i: it.i, score: ok ? 100 : 0 });
    };
  }

  // ---------- event (open) question: ציין → הצג → ציטוט → הסבר ----------
  function runEvent(el, it, exam, done) {
    const u = unit(it.u), e = u.events[it.i], key = `e:${u.id}:${it.i}`;
    const concept = u.concepts.find(c => c.id === e.answer);
    const pool = e.group ? u.concepts.filter(c => c.group === e.group) : u.concepts;
    const r = { zayen: true, quote: true, expl: 0, hatzeg: 0 };
    let step = 0, myDef = '', myExpl = '', quoteIdx = null;
    const STEPS = [['צ', 'ציין'], ['ה', 'הצג'], ['צ', 'ציטוט'], ['ה', 'הסבר']];
    const passage = (pick) => `<div class="passage ${pick ? 'pick' : ''}" id="psg">${e.text.map((t, k) => `<span class="s" data-k="${k}">${esc(t)}</span>`).join(' ')}</div>`;
    function head() {
      return `<span class="tag tint c-${u.color}">${esc(u.name)}</span> <span class="tag tint c-gray">${e.own ? 'שאלה לתרגול' : 'מתוך חוברת המיקוד'}</span>
        <div class="steps" style="margin-top:12px">${STEPS.map(([l, n], k) => `<div class="step ${k < step ? 'done' : k === step ? 'cur' : ''}"><div class="dot">${k < step ? '<i class="fa-solid fa-check"></i>' : l}</div>${n}</div>`).join('')}</div>`;
    }
    function draw() {
      if (step === 0) {
        el.innerHTML = head() + passage(false) + `
          <div class="ask"><i class="fa-solid fa-circle-question" style="color:var(--brand);margin-top:5px"></i>${esc(e.ask)}</div>
          <div class="small muted" style="margin-bottom:8px">שלב 1 – ציין: בחרו את המושג הנכון מבין ${pool.length} האפשרויות.</div>
          <div class="choice-grid">${shuffle(pool).map(c => `<button class="choice" data-c="${c.id}">${esc(c.name)}</button>`).join('')}</div><div id="fb"></div>`;
        el.querySelectorAll('.choice').forEach(b => b.onclick = () => {
          if (b.dataset.c === e.answer) {
            b.classList.add('right'); el.querySelectorAll('.choice').forEach(x => x.disabled = true);
            el.querySelector('#fb').innerHTML = `<div class="feedback ok"><b>נכון!</b> ${esc(concept.name)}.</div><div class="sticky-actions"><button class="btn primary" id="nx">לשלב הבא: הצג</button></div>`;
            el.querySelector('#nx').onclick = () => { step = 1; draw(); };
          } else {
            r.zayen = false; b.classList.add('wrong'); b.disabled = true;
            if (exam) { el.querySelectorAll('.choice').forEach(x => { x.disabled = true; if (x.dataset.c === e.answer) x.classList.add('right'); });
              el.querySelector('#fb').innerHTML = `<div class="feedback bad">התשובה הנכונה: <b>${esc(concept.name)}</b></div><div class="sticky-actions"><button class="btn primary" id="nx">לשלב הבא</button></div>`;
              el.querySelector('#nx').onclick = () => { step = 1; draw(); };
            } else el.querySelector('#fb').innerHTML = `<div class="feedback bad">לא זה. קראו שוב את השאלה – מי בעל העניין ומה הוא עושה? נסו שוב.</div>`;
          }
        });
      } else if (step === 1) {
        el.innerHTML = head() + `
          <div class="ask">שלב 2 – הצג: כתבו את ההגדרה של "${esc(concept.name)}"</div>
          <textarea class="answer" id="def" placeholder="כתבו את ההגדרה כפי שלמדתם...">${esc(myDef)}</textarea>
          <div id="err"></div><div id="reveal"></div>
          <div class="sticky-actions"><button class="btn primary" id="nx">הראה הגדרה</button></div>`;
        const ta = el.querySelector('#def'); ta.oninput = () => { el.querySelector('#err').innerHTML = ''; };
        let shown = false;
        el.querySelector('#nx').onclick = () => {
          myDef = ta.value.trim();
          if (!shown) {
            if (myDef.length < 8) { el.querySelector('#err').innerHTML = '<div class="err">כתבו לפחות משפט אחד של הגדרה לפני שבודקים.</div>'; return; }
            shown = true;
            el.querySelector('#reveal').innerHTML = `<div class="small muted" style="margin:12px 0 4px">סמנו מה כתבתם (לפחות רכיב אחד צריך להתאים לציטוט):</div>
              <div class="checklist">${concept.def.map((d, k) => `<label><input type="checkbox" data-k="${k}"><span>${esc(d)}</span></label>`).join('')}</div>`;
            el.querySelector('#nx').textContent = 'לשלב הבא: ציטוט';
          } else {
            const boxes = [...el.querySelectorAll('.checklist input')];
            r.hatzeg = Math.round(boxes.filter(b => b.checked).length / boxes.length * 100);
            step = 2; draw();
          }
        };
      } else if (step === 2) {
        el.innerHTML = head() + `
          <div class="ask">שלב 3 – ציטוט: לחצו על המשפט מהקטע שממנו לומדים ש"${esc(concept.name)}" בא לידי ביטוי</div>
          ${passage(true)}<div id="fb"></div>
          <div class="sticky-actions"><button class="btn primary" id="nx" disabled>בדיקה</button></div>`;
        const ss = el.querySelectorAll('.s'), nx = el.querySelector('#nx');
        let locked = false;
        ss.forEach(s => s.onclick = () => { if (locked) return; ss.forEach(x => x.classList.remove('sel', 'wrong')); s.classList.add('sel'); quoteIdx = +s.dataset.k; nx.disabled = false; });
        nx.onclick = () => {
          if (locked) { step = 3; return draw(); }
          if (quoteIdx === null) return;
          const sEl = el.querySelector(`.s[data-k="${quoteIdx}"]`);
          if (e.quote.includes(quoteIdx)) {
            locked = true; sEl.classList.remove('sel'); sEl.classList.add('right');
            el.querySelector('#fb').innerHTML = `<div class="feedback ok"><b>מצוין!</b> זה המשפט שמתאים לרכיב בהגדרה.</div>`;
            nx.textContent = 'לשלב האחרון: הסבר';
          } else {
            r.quote = false; sEl.classList.remove('sel'); sEl.classList.add('wrong');
            if (exam) { locked = true; quoteIdx = e.quote[0]; el.querySelector(`.s[data-k="${e.quote[0]}"]`).classList.add('right');
              el.querySelector('#fb').innerHTML = `<div class="feedback bad">המשפט המתאים מסומן בירוק.</div>`; nx.textContent = 'לשלב האחרון: הסבר';
            } else { el.querySelector('#fb').innerHTML = `<div class="feedback bad">המשפט הזה לא מראה את המושג. חפשו את המשפט שמתאר <b>את מה שבעל העניין עושה או טוען</b>.</div>`; nx.disabled = true; quoteIdx = null; }
          }
        };
      } else if (step === 3) {
        el.innerHTML = head() + `
          <div class="ask">שלב 4 – הסבר: קשרו בין הציטוט להגדרה</div>
          <div class="passage" style="font-size:15px">"${esc(e.text[quoteIdx])}"</div>
          <div class="tip" style="margin:10px 0"><b>נוסח מומלץ:</b> ${esc(GUIDE.template)}</div>
          <textarea class="answer" id="ex" placeholder="לפי המתואר באירוע ניתן להבין ש... מדובר ב${esc(concept.name)}, מפני ש...">${esc(myExpl)}</textarea>
          <div id="err"></div><div id="reveal"></div>
          <div class="sticky-actions"><button class="btn primary" id="nx">הראה תשובה לדוגמה</button></div>`;
        const ta = el.querySelector('#ex'); ta.oninput = () => { el.querySelector('#err').innerHTML = ''; };
        el.querySelector('#nx').onclick = () => {
          myExpl = ta.value.trim();
          if (myExpl.length < 15) { el.querySelector('#err').innerHTML = '<div class="err">כתבו הסבר (לפחות משפט) לפני שבודקים.</div>'; return; }
          el.querySelector('.sticky-actions').remove(); ta.readOnly = true;
          el.querySelector('#reveal').innerHTML = `<div class="small muted" style="margin:12px 0 4px">תשובה לדוגמה:</div><div class="model">${esc(e.expl)}</div>
            <div class="small muted" style="margin:12px 0 6px">איך ההסבר שלכם?</div>
            <div class="grid2"><button class="btn" data-sr="40"><i class="fa-solid fa-face-meh"></i> פספסתי חלק</button><button class="btn primary" data-sr="100"><i class="fa-solid fa-face-smile"></i> כתבתי דומה</button></div>`;
          el.querySelectorAll('[data-sr]').forEach(b => b.onclick = () => { r.expl = +b.dataset.sr; finish(); });
        };
      }
    }
    function finish() {
      // בתרגול: תיקון אחרי טעות מקבל חצי מהנקודות. במבחן: אין ניסיון שני.
      const score = Math.round((r.zayen ? 30 : exam ? 0 : 15) + r.hatzeg * 0.2 + (r.quote ? 25 : exam ? 0 : 12) + r.expl * 0.25);
      if (score >= 70) clearMistake(key); else addMistake(key);
      if (!exam) { const p = prog(u.id); p.ev[it.i] = Math.max(p.ev[it.i] || 0, score); addXp(30); }
      el.innerHTML = head().replace(/class="step cur"/, 'class="step done"') + `
        <div class="card fade" style="text-align:center"><div class="score-ring" style="--p:${score}"><div>${score}</div></div>
          <div class="muted small">ציין ${r.zayen ? '✓' : '✗'} · הצג ${r.hatzeg}% · ציטוט ${r.quote ? '✓' : '✗'} · הסבר ${r.expl === 100 ? '✓' : '~'}</div></div>
        <div class="section-title">התשובה המלאה כפי שכותבים בבגרות</div>
        <div class="card full-answer">${fullAnswer(e, concept)}</div>
        <div class="sticky-actions"><button class="btn primary" id="nx">המשך</button></div>`;
      el.querySelector('#nx').onclick = () => done({ type: 'event', u: u.id, i: it.i, score, ok: score >= 70 });
    }
    draw();
  }
  function fullAnswer(e, c) {
    return `<div class="line"><b>ציין:</b> ${esc(c.name)}.</div>
      <div class="line"><b>הצג:</b> ${esc(c.def.join(' '))}</div>
      <div class="line"><b>ציטוט:</b> "${esc(e.text[e.quote[0]])}"</div>
      <div class="line"><b>הסבר:</b> ${esc(e.expl)}</div>`;
  }

  // ---------- results ----------
  function renderResults() {
    clearInterval(timer);
    const s = session; s.finished = true;
    setChrome(s.mode === 'exam' ? 'exam' : 'practice', 'סיכום');
    const res = s.results.filter(Boolean);
    const answered = res.length;
    const score = s.items.length ? Math.round(s.items.reduce((sum, _, k) => sum + (s.results[k] ? s.results[k].score : 0), 0) / s.items.length) : 0;
    if (s.mode === 'exam' && !s.saved) { s.saved = true; S.exams.push({ d: today(), score }); addXp(score); }
    const mins = Math.round((Date.now() - s.start) / 60000);
    const msg = score >= 90 ? 'מושלם! אתם מוכנים לבגרות 🏆' : score >= 70 ? 'יפה מאוד! עוד קצת ואתם שם 💪' : score >= 50 ? 'בכיוון הנכון – תרגלו את הטעויות' : 'לא נורא – חזרו לחומר ונסו שוב';
    view.innerHTML = `
      <div class="card" style="text-align:center">
        <h1 style="font-size:22px;font-weight:900">${s.mode === 'exam' ? 'ציון המבחן' : 'סיכום התרגול'}</h1>
        <div class="score-ring" style="--p:${score}"><div>${score}</div></div>
        <div style="font-weight:700">${msg}</div>
        <div class="muted small">${answered} מתוך ${s.items.length} שאלות · ${mins} דק'</div>
        <div class="grid2" style="margin-top:14px">
          <button class="btn" data-act="mist"><i class="fa-solid fa-rotate-left"></i> הטעויות שלי</button>
          <button class="btn primary" data-act="back"><i class="fa-solid fa-house"></i> סיום</button></div>
      </div>
      <div class="section-title">פירוט</div>
      <div class="card">${s.items.map((it, k) => {
        const u = unit(it.u), r = s.results[k];
        if (it.type === 'mcq') { const q = u.mcq[it.i];
          return `<div class="review-item ${r && r.ok ? 'ok' : 'bad'}"><div style="font-weight:700">${k + 1}. ${esc(q.q)}</div>
            ${r && !r.ok ? `<div class="small" style="color:var(--bad)">ענית: ${esc(q.o[r.sel])}</div>` : ''}${!r ? '<div class="small muted">לא נענתה</div>' : ''}
            <div class="small" style="color:var(--ok)">תשובה נכונה: ${esc(q.o[q.a])}</div><div class="small muted">${esc(q.why)}</div></div>`; }
        const e = u.events[it.i];
        return `<div class="review-item ${r && r.ok ? 'ok' : 'bad'}"><div style="font-weight:700">${k + 1}. שאלת אירוע – ${esc(u.name)} ${r ? `(${r.score})` : ''}</div>
          <div class="small muted">${esc(e.text[0])}</div><div class="small" style="color:var(--ok)">המושג: ${esc(u.concepts.find(c => c.id === e.answer).name)}</div></div>`;
      }).join('')}</div>`;
    view.querySelector('[data-act="back"]').onclick = () => { const b = s.back; session = null; go(b); };
    view.querySelector('[data-act="mist"]').onclick = () => { session = null; startMistakes(); };
  }

  // ================= EXAM =================
  function renderExamSetup() {
    setChrome('exam', 'סימולציית מבחן');
    const last = S.exams.slice(-5).reverse();
    view.innerHTML = `
      <div class="hero"><h1>סימולציית בגרות</h1>
        <p style="color:#c7d2fe;margin:6px 0 0">כמו במבחן האמיתי: שעון רץ, בלי הסברים באמצע, ציון ופירוט בסוף.</p></div>
      <div class="stack cards2" style="margin-top:14px">
        <div class="card unit" data-x="short"><div class="icon-box tint c-blue"><i class="fa-solid fa-hourglass-half"></i></div><div class="meta"><div class="name">מבחן קצר – 15 דקות</div><div class="sub">8 אמריקאיות + שאלת אירוע אחת</div></div></div>
        <div class="card unit" data-x="full"><div class="icon-box tint c-purple"><i class="fa-solid fa-stopwatch"></i></div><div class="meta"><div class="name">מבחן מלא – 40 דקות</div><div class="sub">15 אמריקאיות + 3 שאלות אירוע</div></div></div>
      </div>
      ${last.length ? `<div class="section-title">המבחנים האחרונים שלך</div><div class="card">${last.map(x => `<div class="row" style="justify-content:space-between;padding:6px 0"><span class="muted">${x.d}</span><b style="color:${x.score >= 70 ? 'var(--ok)' : 'var(--bad)'}">${x.score}</b></div>`).join('')}</div>` : ''}`;
    view.querySelectorAll('[data-x]').forEach(c => c.onclick = () => {
      const full = c.dataset.x === 'full';
      const items = [...pickMcq(UNITS, full ? 15 : 8).map(x => ({ type: 'mcq', ...x })), ...pickEvents(full ? 3 : 1).map(x => ({ type: 'event', ...x }))];
      startSession(items, full ? 'מבחן מלא' : 'מבחן קצר', '/exam', 'exam', full ? 40 : 15);
    });
  }

  // ================= MEGILLA =================
  let megFilter = 'all';
  function renderMegilla() {
    setChrome('megilla', 'מגילת העצמאות');
    const partOf = id => MEG.parts.find(p => p.id === id);
    view.innerHTML = `
      <div class="scroll-intro"><span class="chip" style="background:#fde68a;color:#78350f"><i class="fa-solid fa-scroll"></i> ה' באייר תש"ח · 14.5.1948</span>
        <h1 style="margin-top:8px">מגילת העצמאות</h1><p style="margin:6px 0 0;color:#78350f">${esc(MEG.intro)}</p></div>
      <div class="section-title">מבנה המגילה</div>
      <div class="parts-map">${MEG.parts.map(p => `<div class="part-row tint c-${p.color}"><i class="fa-solid fa-bookmark" style="margin-top:5px"></i><div><b>${esc(p.name)}</b><div class="small">${esc(p.desc)}</div></div></div>`).join('')}</div>
      <div class="section-title">הנוסח המלא + הסבר</div>
      <div class="filters">${[['all', 'הכול'], ...MEG.parts.map(p => [p.id, p.name])].map(([k, l]) => `<button data-f="${k}" class="${megFilter === k ? 'active' : ''}">${esc(l)}</button>`).join('')}</div>
      <div class="stack" id="paras">${MEG.paragraphs.map((p, k) => {
        if (megFilter !== 'all' && p.part !== megFilter) return '';
        const part = partOf(p.part);
        return `<div class="para"><div class="row" style="justify-content:space-between"><span class="num">פסקה ${k + 1}</span><span class="tag tint c-${part.color}">${esc(p.tag)}</span></div>
          <div class="ptext">${esc(p.text)}</div>
          <button class="btn ghost" style="padding:4px 0" data-exp="${k}"><i class="fa-solid fa-lightbulb"></i> מה זה אומר?</button>
          <div class="exp" id="exp${k}" hidden>${esc(p.explain)}</div></div>`;
      }).join('')}</div>
      <div class="section-title">בחנו את עצמכם</div>
      <div class="card" id="megquiz"></div>`;
    view.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { megFilter = b.dataset.f; renderMegilla(); });
    view.querySelectorAll('[data-exp]').forEach(b => b.onclick = () => { const x = document.getElementById('exp' + b.dataset.exp); x.hidden = !x.hidden; });
    megQuiz();
  }
  function megQuiz() {
    const box = document.getElementById('megquiz');
    const pool = MEG.paragraphs.filter(p => p.part !== 'end');
    const p = pool[Math.floor(Math.random() * pool.length)];
    const tags = [...new Set(pool.map(x => x.tag))];
    const opts = shuffle([p.tag, ...shuffle(tags.filter(t => t !== p.tag)).slice(0, 3)]);
    box.innerHTML = `<div class="small muted">לאיזה חלק במגילה שייכת הפסקה?</div>
      <div class="ptext" style="font-family:'Frank Ruhl Libre',serif;font-size:17px;margin:8px 0">"${esc(p.text.length > 190 ? p.text.slice(0, 190) + '...' : p.text)}"</div>
      ${opts.map(o => `<button class="opt" data-o="${esc(o)}"><span>${esc(o)}</span></button>`).join('')}<div id="mfb"></div>`;
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const ok = b.dataset.o === p.tag;
      box.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.o === p.tag) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
      if (ok) addXp(5);
      box.querySelector('#mfb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'bad'}">${ok ? '<b>נכון!</b> ' : ''}${esc(p.explain.split('\n')[0])}</div><button class="btn primary block" style="margin-top:10px" id="mnext">פסקה אחרת</button>`;
      box.querySelector('#mnext').onclick = megQuiz;
    });
  }

  // ================= FLASHCARDS =================
  function renderCards(uid) {
    const pool = (uid && unit(uid) ? [unit(uid)] : UNITS).flatMap(u => u.concepts.map(c => ({ u, c })));
    let deck = shuffle(pool), k = 0, known = 0;
    setChrome('practice', 'כרטיסיות שינון', uid ? '/unit/' + uid : '/practice');
    function draw() {
      if (k >= deck.length) {
        view.innerHTML = `<div class="card" style="text-align:center"><div class="score-ring" style="--p:${Math.round(known / deck.length * 100)}"><div>${known}/${deck.length}</div></div>
          <div style="font-weight:700">ידעתם ${known} מושגים מתוך ${deck.length}</div>
          <button class="btn primary block" style="margin-top:12px" id="again">עוד סיבוב</button></div>`;
        document.getElementById('again').onclick = () => { deck = shuffle(pool); k = 0; known = 0; draw(); }; return;
      }
      const { u, c } = deck[k];
      view.innerHTML = `<div class="q-top"><span>${k + 1} / ${deck.length}</span><span class="tag tint c-${u.color}">${esc(u.name)}</span></div>
        <div class="bar" style="margin:8px 0 14px;height:6px"><span style="width:${k / deck.length * 100}%"></span></div>
        <div class="flash" id="fl"><div class="flash-in">
          <div class="flash-face"><div class="big">${esc(c.name)}</div><div class="muted small" style="margin-top:10px"><i class="fa-solid fa-hand-pointer"></i> נסו להגיד את ההגדרה ואז לחצו להפוך</div></div>
          <div class="flash-face flash-back"><b style="margin-bottom:6px">${esc(c.name)}</b><ul class="plain-list">${c.def.map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>
        </div></div>
        <div class="grid2" style="margin-top:14px"><button class="btn" id="no"><i class="fa-solid fa-xmark" style="color:var(--bad)"></i> עוד לא</button><button class="btn primary" id="yes"><i class="fa-solid fa-check"></i> ידעתי</button></div>`;
      document.getElementById('fl').onclick = e => e.currentTarget.classList.toggle('flip');
      document.getElementById('yes').onclick = () => { known++; k++; addXp(2); draw(); };
      document.getElementById('no').onclick = () => { deck.push(deck[k]); k++; draw(); };
    }
    draw();
  }

  // ================= GUIDE =================
  function renderGuide() {
    setChrome('guide', 'איך עונים על שאלת אירוע');
    const g = GUIDE;
    view.innerHTML = `
      <h1 style="font-size:24px;font-weight:900">איך עונים על שאלת אירוע</h1>
      <p class="muted" style="margin-top:4px">לפי המבנה המעודכן (החל מחורף תשפ"ו). שאלות אירוע מופיעות בפרק הראשון ובפרק הרביעי בבגרות.</p>
      <div class="grid2" style="margin-top:12px">${g.parts.map((p, k) => `<div class="card c-${['blue', 'purple', 'amber', 'teal'][k]}"><div class="icon-box tint" style="font-weight:900">${p.l}</div><h3 style="font-weight:800;margin-top:8px">${p.name}</h3><div class="small muted">${esc(p.d)}</div></div>`).join('')}</div>
      <div class="section-title">שלבי העבודה</div>
      <div class="card"><ol style="margin:0;padding-inline-start:20px">${g.steps.map(s => `<li style="margin:6px 0">${esc(s)}</li>`).join('')}</ol></div>
      <div class="section-title">נוסח מומלץ להסבר (קישור)</div>
      <div class="tip" style="font-size:15px">${esc(g.template)}</div>
      <div class="section-title">דוגמה מלאה</div>
      <div class="passage">${esc(g.example.text)}</div>
      <div class="ask">ציינו והציגו את הזכות של איש הציבור שנפגעה, לטענת הוצאת הספרים.</div>
      <div class="card full-answer">${g.example.answer.map(([k, v]) => `<div class="line"><b>${k}:</b> ${esc(v)}</div>`).join('')}</div>
      <button class="btn primary block" style="margin-top:14px" id="try"><i class="fa-solid fa-pen"></i> נסו בעצמכם – שאלת אירוע אקראית</button>`;
    document.getElementById('try').onclick = () => startEvents(pickEvents(1), 'שאלת אירוע', '/guide');
  }

  updateTop();
  render();
})();

</script>
</body>
</html>
